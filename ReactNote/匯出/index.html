<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>React 教學筆記</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    nav {
      width: 350px;
      background-color: #f5f5f5;
      padding: 1em;
      border-right: 1px solid #ccc;
      box-sizing: border-box;
      overflow-y: auto;
    }

    nav h2 {
      font-size: 1.2em;
      margin-top: 0;
    }

    nav ul {
      list-style: none;
      padding: 0;
    }

    nav li {
      margin: 0.5em 0;
    }

    nav a {
      color: #007BFF;
      text-decoration: none;
      display: block;
      padding: 0.2em;
      border-radius: 4px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    nav a.active {
      background-color: #007BFF;
      color: white;
      font-weight: bold;
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <nav>
    <h2>React 教學筆記</h2>
    <ul id="nav-list"></ul>
  </nav>

  <iframe name="content-frame" src="Components/01_React_簡介.html" id="content-frame"></iframe>

  <script>
    // 定義章節陣列
    const chapters = [
      { id: '01', title: 'React_簡介' },
      { id: '02', title: '頁面檔的基本結構' },
      { id: '03_01', title: 'JS 介紹 - TypeScript簡介 及 使用CSS' },
      { id: '03_02', title: 'JS 介紹 - 變數的宣告與型別設定' },
      { id: '03_03', title: 'JS 介紹 - type (複雜型別)' },
      { id: '03_04', title: 'JS 介紹 - interface(介面)' },
      { id: '03_05', title: 'JS 介紹 - 陣列' },
      { id: '03_06', title: 'JS 介紹 - 陣列 - map 與 foreach' },
      { id: '03_07', title: 'JS 介紹 - 陣列 - 數值修改' },
      { id: '03_08', title: 'JS 介紹 - 函式' },
      { id: '03_09', title: 'JS 介紹 - 多型別變數(聯集與交集)' },
      { id: '03_10', title: 'JS 介紹 - JS 語句' },
      { id: '03_11', title: 'JS 介紹 - 樣板字串' },
      { id: '03_12', title: 'JS 介紹 - 空值判斷' },
      { id: '04', title: 'useState 狀態機' },
      { id: '05', title: 'props 組件的信息傳遞 (父傳子)' },
      { id: '06', title: 'useReducer 管理複雜邏輯的狀態機' },
      { id: '07', title: 'useContext 遠端的信息傳遞' },
      { id: '08', title: 'useEffect 效果鉤子' },
      { id: '09', title: 'useRef 從輸入框獲取值' },
      { id: '10', title: 'useSyncExternalStore 外部資料訂閱' },
      { id: '11', title: '附錄 - Button 的 onClick 呼叫函式的寫法' },
      { id: '12', title: '附錄 - 下載後端API產出的檔案' },
      { id: '13', title: '附錄 - 正規表達式' }
    ];

    // 使用 map 產生導覽列
    const navList = document.getElementById('nav-list');
    const navHTML = chapters.map(chapter => {
      const href = `Components/${chapter.id}_${chapter.title}.html`;
      return `
        <li>
          <a href="${href}" target="content-frame">${chapter.id} ${chapter.title}</a>
        </li>
      `;
    }).join('');
    
    navList.innerHTML = navHTML;

    // 獲取所有連結
    const links = document.querySelectorAll('nav a');
    const iframe = document.getElementById('content-frame');

    function setActiveLink(href) {
      links.forEach(link => {
        if (link.getAttribute('href') === href) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    // 初始載入
    setActiveLink(iframe.getAttribute('src'));

    // 當使用者點擊側邊欄連結時，更新樣式
    links.forEach(link => {
      link.addEventListener('click', (e) => {
        setActiveLink(link.getAttribute('href'));
      });
    });

    // 當 iframe 中的內容變動時也嘗試更新
    iframe.addEventListener('load', () => {
      const src = iframe.contentWindow.location.pathname.split('/').pop();
      const fullPath = 'Components/' + src;
      setActiveLink(fullPath);
    });
  </script>
</body>
</html>
